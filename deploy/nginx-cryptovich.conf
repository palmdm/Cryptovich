# nginx for https://cryptovich.info.gf, behind the WAF.
#
# One upstream for everything. The web server on 3003 answers pages and
# forwards /api, /.well-known, /nodeinfo and /federation to the API itself,
# so nginx must NOT route any of those straight to port 4000 — the API
# port is bound to 127.0.0.1 in .env.production and a direct route would
# also bypass the paths federation depends on.
#
# Replace 127.0.0.1 with the Cryptovich server's address if nginx runs on a
# different machine (and keep WEB_BIND=0.0.0.0 in .env there).

upstream fourtip_web {
    server 127.0.0.1:3003;
    keepalive 16;
}

server {
    listen 80;
    # listen 443 ssl;  # if TLS ends here rather than at the WAF
    server_name cryptovich.info.gf;

    # Uploads are capped at 5MB by the API (MAX_UPLOAD_BYTES); a multipart
    # body carries some overhead on top, so this sits above it.
    client_max_body_size 8m;

    # Where the project lives on this server — the maintenance page and its
    # switch are read from its deploy/maintenance folder.
    set $site_dir /opt/cryptovich;

    # While Cryptovich is being updated, or is down for any reason, visitors get
    # deploy/maintenance/index.html — "updating, back in a couple of
    # minutes", reloading itself — instead of nginx's bare "502 Bad
    # Gateway". It is a file on this host, so it needs nothing from the
    # containers: `docker compose down` and the rebuild are covered. Sent
    # as 503 with Retry-After, so search engines know to come back. Only
    # nginx's own errors land here: a 503 the site itself answers passes
    # through as it was.
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root $site_dir/deploy/maintenance;
        try_files /index.html =404;
        internal;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
    }

    # The status page has its own small service (apps/status, port 3005,
    # started from deploy/gate), so it answers even when the site, the API
    # or the database does not. Straight to it, not through the web server
    # — that is the point — and never the "updating" page.
    location = /status {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        error_page 502 503 504 = @status_restarting;
    }
    location = /status.json {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        error_page 502 503 504 = @status_restarting;
    }
    location @status_restarting {
        charset utf-8;
        default_type text/plain;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        return 503 "Страница состояния перезапускается — обновите через полминуты.\nThe status page is restarting — try again in half a minute.\n";
    }

    location / {
        # Maintenance by hand, with the site still up (a long migration):
        #   touch /opt/cryptovich/deploy/maintenance/on   — everyone gets the page
        #   rm /opt/cryptovich/deploy/maintenance/on      — back to normal
        # /status keeps answering either way; nginx needs no reload.
        if (-f $site_dir/deploy/maintenance/on) {
            return 503;
        }

        proxy_pass http://fourtip_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The public host, unchanged. Federation signatures cover `host`;
        # the API also accepts the configured domain, but passing the real
        # one keeps logs, redirects and cookies honest.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;

        # The site is https to the outside even when TLS ends at the WAF
        # and the hop to nginx is plain http — `$scheme` would then say
        # http. Stated outright so nothing downstream thinks otherwise.
        proxy_set_header X-Forwarded-Proto https;

        # The reader's address, for rate limiting. Behind Cloudflare, also
        # set `real_ip_header CF-Connecting-IP;` with `set_real_ip_from`
        # for each range at https://www.cloudflare.com/ips/, or every
        # visitor looks like the WAF and they share one rate limit.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 60s;
    }
}
