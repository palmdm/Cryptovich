packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true
# Transitive packages held at versions with known vulnerabilities fixed
# (pnpm audit). pnpm 10 reads overrides here, not from package.json.
overrides:
  fast-uri: ^3.1.8
  brace-expansion@5: ^5.0.12
  postcss: ^8.5.23
