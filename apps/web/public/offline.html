<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cryptovich — offline</title>
<link rel="icon" href="/favicon.ico">
<style>
  /* The default theme's colours: Twitter by day, X by night. */
  :root { color-scheme: light dark; --bg: #ffffff; --text: #0f1419; --muted: #536471; --accent: #1d9bf0; --accent-hover: #1a8cd8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --text: #e7e9ea; --muted: #71767b; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 26rem; padding: 24px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.3rem; margin: 16px 0 8px; }
  p { margin: 0 0 22px; color: var(--muted); }
  button { font: inherit; font-weight: 700; padding: 10px 22px; border: 0; border-radius: 9999px; background: var(--accent); color: #fff; cursor: pointer; }
  button:hover { background: var(--accent-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>Cryptovich will open as soon as you are back online.</p>
  <button type="button" onclick="location.reload()">Retry</button>
</main>
</body>
</html>
